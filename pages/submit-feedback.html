<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div id="preloader" aria-label="Loading website"><div class="loader-ring"></div></div>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">SkillForge Technology</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
            <li class="nav-item"><a class="nav-link" href="feedback.html">Testimonials</a></li>
            <li class="nav-item"><a class="nav-link active" href="submit-feedback.html">Submit Feedback</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-hero section-pad-sm">
      <div class="container reveal">
        <h1 class="fw-bold">Submit Feedback</h1>
        <p class="mb-0">Your feedback helps us continuously improve our project quality and customer experience.</p>
      </div>
    </section>

    <section class="section-pad">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 reveal">
            <form id="feedbackForm" class="form-panel" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="customerName" class="form-label">Customer Name</label>
                  <input type="text" class="form-control" id="customerName" required>
                </div>
                <div class="col-md-6">
                  <label for="projectName" class="form-label">Project Name</label>
                  <input type="text" class="form-control" id="projectName" required>
                </div>
                <div class="col-12">
                  <label for="rating" class="form-label">Rating (1–5 stars)</label>
                  <select class="form-select" id="rating" required>
                    <option value="" selected disabled>Select rating</option>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Fair</option>
                    <option value="1">1 - Needs Improvement</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="feedbackMessage" class="form-label">Feedback Message</label>
                  <textarea class="form-control" id="feedbackMessage" rows="4" required></textarea>
                </div>
                <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-3">
                  <button type="submit" class="btn btn-brand">Submit Feedback</button>
                  <p class="mb-0" id="feedbackNotice" aria-live="polite"></p>
                </div>
                <div class="col-12">
                  <a href="feedback.html" class="link-brand">View all testimonials →</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-3 align-items-center">
      <p class="mb-0">© <span id="year"></span> SkillForge Technology. All rights reserved.</p>
      <div class="social-links">
        <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
        <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
        <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
